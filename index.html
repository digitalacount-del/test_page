<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Frame Ultra-Thick 3D Text Flying in Space</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- 3D立体テキスト生成用コンポーネント (troika-3d-text) -->
    <script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
      }
    </style>
  </head>
  <body>
    <script>
      // 激厚3Dテキスト群を動的に生成・制御するコンポーネント
      AFRAME.registerComponent('flying-thick-texts', {
        schema: {
          count: { type: 'int', default: 25 }
        },
        init: function () {
          this.texts = [];
          
          // 明るく綺麗な発光系カラー
          const colors = [
            '#00FFFF', // シアン
            '#FF007F', // ピンク
            '#FFD700', // ゴールド
            '#00FF7F', // グリーン
            '#FF4500', // オレンジ
            '#A020F0', // パープル
            '#FFFFFF'  // ホワイト
          ];

          for (let i = 0; i < this.data.count; i++) {
            const textEntity = document.createElement('a-troika-text');

            const color = colors[Math.floor(Math.random() * colors.length)];

            // 基本設定
            textEntity.setAttribute('value', 'Hello world!');
            textEntity.setAttribute('align', 'center');
            textEntity.setAttribute('color', color);

            // ★文字サイズの設定 (巨大化)
            textEntity.setAttribute('font-size', '12');

            // ★激厚（極厚）の奥行き設定
            // extrude-depth で文字の厚みを超巨大に（通常の何十倍もの厚さ）
            textEntity.setAttribute('extrude-depth', '4.0'); 

            // マテリアル・発光設定
            textEntity.setAttribute('material', `color: ${color}; roughness: 0.1; metalness: 0.8;`);

            // 初期位置をランダム配置
            const posX = (Math.random() - 0.5) * 200;
            const posY = (Math.random() - 0.5) * 200;
            const posZ = (Math.random() - 0.5) * 200;
            textEntity.setAttribute('position', `${posX} ${posY} ${posZ}`);

            // 回転・移動パラメータ
            textEntity.userData = {
              speedX: (Math.random() - 0.5) * 0.3,
              speedY: (Math.random() - 0.5) * 0.3,
              speedZ: (Math.random() - 0.5) * 0.3,
              rotSpeedX: (Math.random() - 0.5) * 1.5,
              rotSpeedY: (Math.random() - 0.5) * 1.5,
              rotSpeedZ: (Math.random() - 0.5) * 1.5
            };

            this.el.appendChild(textEntity);
            this.texts.push(textEntity);
          }
        },

        tick: function () {
          const bounds = 150; // ループ範囲

          this.texts.forEach((textEntity) => {
            const pos = textEntity.getAttribute('position');
            const rot = textEntity.getAttribute('rotation');
            const data = textEntity.userData;

            // 位置移動
            let newX = pos.x + data.speedX;
            let newY = pos.y + data.speedY;
            let newZ = pos.z + data.speedZ;

            // 境界チェック＆反対側から再登場
            if (Math.abs(newX) > bounds) newX = -newX;
            if (Math.abs(newY) > bounds) newY = -newY;
            if (Math.abs(newZ) > bounds) newZ = -newZ;

            textEntity.setAttribute('position', `${newX} ${newY} ${newZ}`);

            // 回転移動（回転することで圧倒的な厚みが確認できます）
            textEntity.setAttribute('rotation', {
              x: rot.x + data.rotSpeedX,
              y: rot.y + data.rotSpeedY,
              z: rot.z + data.rotSpeedZ
            });
          });
        }
      });
    </script>

    <a-scene>
      <!-- 漆黒の宇宙空間 -->
      <a-sky color="#010104"></a-sky>

      <!-- 星屑背景 -->
      <a-entity id="stars"></a-entity>

      <!-- 激厚・巨大3Dテキスト群 -->
      <a-entity flying-thick-texts="count: 25"></a-entity>

      <!-- 立体感を際立たせるライティング -->
      <a-light type="ambient" color="#FFFFFF" intensity="1.0"></a-light>
      <a-light type="directional" color="#FFFFFF" intensity="2.5" position="1 2 1"></a-light>
      <a-light type="point" color="#FFFFFF" intensity="2" position="0 0 0" distance="200"></a-light>

      <!-- カメラ設定 -->
      <a-entity id="rig" position="0 0 0">
        <a-camera look-controls wasd-controls position="0 0 0">
          <a-cursor color="#FFFFFF" opacity="0.6"></a-cursor>
        </a-camera>
      </a-entity>
    </a-scene>

    <!-- 星屑生成処理 -->
    <script>
      const starsContainer = document.getElementById('stars');
      const starCount = 500;
      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('a-sphere');
        const radius = Math.random() * 0.2 + 0.05;
        const x = (Math.random() - 0.5) * 350;
        const y = (Math.random() - 0.5) * 350;
        const z = (Math.random() - 0.5) * 350;
        
        star.setAttribute('radius', radius);
        star.setAttribute('position', `${x} ${y} ${z}`);
        star.setAttribute('color', '#FFFFFF');
        star.setAttribute('material', 'shader: flat; opacity: 0.9');
        starsContainer.appendChild(star);
      }
    </script>
  </body>
</html>
